<!DOCTYPE html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238B5CF6'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Aura Habit & Productivity Tracker — Cyber-Obsidian Edition</title>
    <meta name="description" content="Ekosistem produktivitas all-in-one universal: Habit Tracker, Matriks Eisenhower, Time Blocking 24 Jam, dan Pomodoro Ambient Timer." />
    
    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            colors: {
              aura: {
                dark: '#07090E',
                card: '#0E111D',
                violet: '#8B5CF6',
                cyan: '#06B6D4',
                emerald: '#10B981',
                amber: '#F59E0B',
              }
            },
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'radar': 'radar 2s cubic-bezier(0, 0, 0.2, 1) infinite',
            },
            keyframes: {
              radar: {
                '0%': { transform: 'scale(0.95)', opacity: '0.9' },
                '100%': { transform: 'scale(2.2)', opacity: '0' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #07090E;
        background-image: 
          radial-gradient(circle at 18% 12%, rgba(139, 92, 246, 0.12) 0%, transparent 35%),
          radial-gradient(circle at 82% 18%, rgba(6, 182, 212, 0.10) 0%, transparent 35%),
          radial-gradient(circle at 50% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
          radial-gradient(rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 100% 100%, 100% 100%, 100% 100%, 28px 28px;
        background-attachment: fixed;
        color: #F8FAFC;
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      
      /* Sleek Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #07090E;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.14);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.5);
      }
    </style>
  </head>
  <body class="bg-[#07090E] text-slate-100 min-h-screen antialiased selection:bg-violet-500/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
